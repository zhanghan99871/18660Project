[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-optimization"
version = "0.1.0"
description = "Adaptive local rule optimization for collective navigation (18-660 project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["swarm*", "experiments*", "visualization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
